<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Via Lupe</title>
  <meta name="description" content="By way of grief. Writing on faith, hospitality, and grief, following the church year.">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ViaLupe" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Apply a saved theme before paint to avoid a flash
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <script>if (document.documentElement.dataset.theme) document.body.classList.add(document.documentElement.dataset.theme);</script>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="container">
    <nav>
      <a class="nav-title" href="/">Via Lupe</a>
      <div class="nav-links">
        <a href="/writing/">Writing</a>
        <a href="/lupe/" lang="grc">λύπη</a>
        <a href="/about/">About</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">●</button>
      </div>
    </nav>

    <main>
      
<h1>Writing</h1>
<p class="empty-note">The first piece arrives on the First Sunday of Advent, November 29.</p>

    </main>
  </div>

  <script>
    (function () {
      const toggle = document.getElementById('themeToggle');
      const body = document.body;
      const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = () => body.classList.contains('dark') || (!body.classList.contains('light') && prefersDark());

      function paint() { toggle.style.color = isDark() ? '#e8e4de' : '#0a0a0a'; }

      toggle.addEventListener('click', () => {
        const next = isDark() ? 'light' : 'dark';
        body.classList.remove('light', 'dark');
        body.classList.add(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        paint();
      });
      paint();
    })();
  </script>
  <script src="/js/background.js"></script>
</body>
</html>
